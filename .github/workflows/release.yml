name: Build

permissions:
  packages: write

on:
  push:
    tags:
      - 'chatgpt-desktop/*'

jobs:
  chatgpt-desktop:
    if: startsWith(github.ref_name, 'chatgpt-desktop/')
    name: chatgpt-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        id: setup
        uses: ./.github/workflows/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile.chatgpt-desktop
          tags: ghcr.io/${{ github.repository }}/chatgpt-desktop:${{ steps.setup.outputs.ref_version }}
          platforms: linux/amd64,linux/arm64
          push: true
